[config]
# ...

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/matugen/generated/waybar-colors.css'
post_hook = 'pkill waybar || true'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/matugen/generated/btop-colors.theme'
post_hook = 'mkdir -p $HOME/.config/btop/themes; ln -nfs $HOME/.config/matugen/generated/btop-colors.theme $HOME/.config/btop/themes/matugen.theme'

[templates.wlogout]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/matugen/generated/wlogout-colors.css'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/matugen/generated/rofi-colors.rasi'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/matugen/generated/kitty-colors.conf'
post_hook = '''
ln -nfs $HOME/.config/matugen/generated/kitty-colors.conf $HOME/.config/kitty/kitty-colors.conf;
pkill -SIGUSR1 kitty || true
'''

[templates.vscode-raw]
input_path = '~/.config/matugen/templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = '~/.config/matugen/templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/matugen/generated/hyprlock-colors.conf'

[templates.firefox-website-colors]
input_path = '~/.config/matugen/templates/firefox-colors.css'
output_path = '~/.config/zen/jkdz1p38.Default (release)/chrome/colors.css'

[templates.swaync]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/swaync/colors.css'
post_hook = 'swaync-client -rs || true'

[templates.obsidian]
input_path = '~/.config/matugen/templates/obsidian.css'
output_path = '~/Documents/Obsidian Vaults/Notion/.obsidian/snippets/matugen.css'

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/themes/matugen'
post_hook = 'pkill -USR1 cava || true'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.intellij]
input_path = '~/.config/matugen/templates/intellij.json.tera'
output_path = '~/.config/JetBrains/matugen/colors.json'

[templates.vicinae-light]
input_path = '~/.config/matugen/templates/vicinae-light.toml'
output_path = '~/.local/share/vicinae/themes/matugen-light.toml'

[templates.vicinae-dark]
input_path = '~/.config/matugen/templates/vicinae-dark.toml'
output_path = '~/.local/share/vicinae/themes/matugen-dark.toml'

[templates.DiscordPlus]
input_path = '~/.config/matugen/templates/DiscordPlus.theme.css'
output_path = '~/.var/app/com.discordapp.Discord/config/BetterDiscord/themes/DiscordPlus.theme.css'

[templates.eww]
input_path = '~/.config/matugen/templates/eww-colors.scss'
output_path = '~/.config/eww/colors.scss'
