# Tema Vicinae "Light" generato da matugen: modifica questo template, non il file generato.
# Tenere allineato con vicinae-dark.toml.
# Le chiavi non definite vengono ereditate da vicinae-light.
# Riferimento completo: vicinae theme template

[meta]
name = "Matugen Light"
description = "Colori ricavati dallo sfondo con matugen"
variant = "light"
inherits = "vicinae-light"

[colors.core]
accent = "{{colors.primary.light.hex}}"
accent_foreground = "{{colors.on_primary.light.hex}}"
background = "{{colors.surface.light.hex}}"
foreground = "{{colors.on_surface.light.hex}}"
secondary_background = "{{colors.surface_container.light.hex}}"
border = "{{colors.outline_variant.light.hex}}"

[colors.main_window]
border = "colors.core.border"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

# Tinte con nome: restano fisse e sono scelte per essere leggibili su questo sfondo
[colors.accents]
blue = "#2259d0"
green = "#1f7a45"
magenta = "#a2359e"
orange = "#b0560f"
red = "#b83f25"
yellow = "#856615"
cyan = "#0d7682"
purple = "#7a44d4"

# For now, shortcuts cannot have their own dedicated background
[colors.shortcut]
border = "colors.core.border"

[colors.text]
default = "colors.core.foreground"
muted = "{{colors.on_surface_variant.light.hex}}"
danger = "{{colors.error.light.hex}}"
success = "#1f7a45"
placeholder = "{{colors.outline.light.hex}}"
selection = { background = "{{colors.secondary.light.hex}}", foreground = "{{colors.on_secondary.light.hex}}" }

[colors.text.links]
default = "{{colors.primary.light.hex}}"
visited = "{{colors.tertiary.light.hex}}"

[colors.input]
border = "colors.core.border"
border_focus = "colors.core.accent"
border_error = "{{colors.error.light.hex}}"

[colors.button.primary]
background = "{{colors.primary.light.hex}}"
foreground = "{{colors.on_primary.light.hex}}"
hover = { background = "#bb{{colors.primary.light.hex_stripped}}" }
focus = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground = "{{colors.on_surface.light.hex}}"
secondary_foreground = "{{colors.on_surface_variant.light.hex}}"

[colors.list.item.selection]
background = "{{colors.secondary_container.light.hex}}"
foreground = "{{colors.on_secondary_container.light.hex}}"
secondary_background = "{{colors.secondary_container.light.hex}}"
secondary_foreground = "{{colors.on_secondary_container.light.hex}}"

[colors.grid.item]
background = "colors.core.secondary_background"
hover = { outline = "{{colors.outline.light.hex}}" }
selection = { outline = "colors.core.accent" }

[colors.scrollbars]
background = "{{colors.outline_variant.light.hex}}"

[colors.loading]
bar = "colors.core.accent"
spinner = "colors.core.accent"
