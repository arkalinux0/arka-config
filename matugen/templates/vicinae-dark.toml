# Tema Vicinae "Dark" generato da matugen: modifica questo template, non il file generato.
# Tenere allineato con vicinae-light.toml.
# Le chiavi non definite vengono ereditate da vicinae-dark.
# Riferimento completo: vicinae theme template

[meta]
name = "Matugen Dark"
description = "Colori ricavati dallo sfondo con matugen"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
accent = "{{colors.primary.dark.hex}}"
accent_foreground = "{{colors.on_primary.dark.hex}}"
background = "{{colors.surface.dark.hex}}"
foreground = "{{colors.on_surface.dark.hex}}"
secondary_background = "{{colors.surface_container.dark.hex}}"
border = "{{colors.outline_variant.dark.hex}}"

[colors.main_window]
border = "colors.core.border"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

# Tinte con nome: restano fisse e sono scelte per essere leggibili su questo sfondo
[colors.accents]
blue = "#6b9bf5"
green = "#4cc47f"
magenta = "#d19bf0"
orange = "#f0883e"
red = "#ef7f68"
yellow = "#d9b872"
cyan = "#3cc2cf"
purple = "#bc8cff"

# For now, shortcuts cannot have their own dedicated background
[colors.shortcut]
border = "colors.core.border"

[colors.text]
default = "colors.core.foreground"
muted = "{{colors.on_surface_variant.dark.hex}}"
danger = "{{colors.error.dark.hex}}"
success = "#4cc47f"
placeholder = "{{colors.outline.dark.hex}}"
selection = { background = "{{colors.secondary.dark.hex}}", foreground = "{{colors.on_secondary.dark.hex}}" }

[colors.text.links]
default = "{{colors.primary.dark.hex}}"
visited = "{{colors.tertiary.dark.hex}}"

[colors.input]
border = "colors.core.border"
border_focus = "colors.core.accent"
border_error = "{{colors.error.dark.hex}}"

[colors.button.primary]
background = "{{colors.primary.dark.hex}}"
foreground = "{{colors.on_primary.dark.hex}}"
hover = { background = "#bb{{colors.primary.dark.hex_stripped}}" }
focus = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground = "{{colors.on_surface.dark.hex}}"
secondary_foreground = "{{colors.on_surface_variant.dark.hex}}"

[colors.list.item.selection]
background = "{{colors.secondary_container.dark.hex}}"
foreground = "{{colors.on_secondary_container.dark.hex}}"
secondary_background = "{{colors.secondary_container.dark.hex}}"
secondary_foreground = "{{colors.on_secondary_container.dark.hex}}"

[colors.grid.item]
background = "colors.core.secondary_background"
hover = { outline = "{{colors.outline.dark.hex}}" }
selection = { outline = "colors.core.accent" }

[colors.scrollbars]
background = "{{colors.outline_variant.dark.hex}}"

[colors.loading]
bar = "colors.core.accent"
spinner = "colors.core.accent"
