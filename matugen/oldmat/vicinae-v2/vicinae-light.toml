# This file demonstrates all available theme configuration options for Vicinae.
# You don't need to define all of these: only override what you want to customize.
# Undefined colors will be automatically derived from core colors or inherited from base themes.
#
# Check out the full documentation at https://docs.vicinae.com/theming/getting-started

[meta]
name = "Matugen Light"
description = "Matugen theme generated from Vicinae theme template"
variant = "light"                              # "dark" | "light": impacts what icon to show in some circumstances

[colors.core]
accent = "{{colors.primary.light.hex}}"
accent_foreground = "{{colors.on_primary.light.hex}}"
background = "{{colors.surface.light.hex}}"
foreground = "{{colors.on_surface.light.hex}}"
secondary_background = "{{colors.surface_container.light.hex}}"
border = "{{colors.source_color.light.hex}}"

[colors.main_window]
border = "{{colors.source_color.light.hex}}"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "{{colors.source_color.light.hex}}"

[colors.accents]
blue = "#2f6fed"
green = "#3a9c61"
magenta = "#bc8cff"
orange = "#f0883e"
red = "#b9543b"
yellow = "#c9a76e"
cyan = "#18a5b3"
purple = "#bc8cff"

# For now, shortcuts cannot have their own dedicated background
[colors.shortcut]
border = "colors.core.border"

[colors.text]
default = "colors.core.foreground"
muted = "{{colors.on_surface_variant.light.hex}}"
danger = "{{colors.error.light.hex}}"
success = "{{colors.surface_tint.light.hex}}"
placeholder = "{{colors.outline.light.hex}}"
selection = { background = "{{colors.secondary.light.hex}}", foreground = "{{colors.on_secondary.light.hex}}" }

[colors.text.links]
default = "{{colors.primary.light.hex}}"
visited = "{{colors.tertiary.light.hex}}"

[colors.input]
border = "{{colors.outline_variant.light.hex}}"
border_focus = "{{colors.primary.light.hex}}"
border_error = "{{colors.error.light.hex}}"

[colors.button.primary]
background = "{{colors.primary.light.hex}}"
foreground = "{{colors.on_primary.light.hex}}"
hover = { background = "#bb{{colors.primary.light.hex_stripped}}" }
focus = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground = "{{colors.secondary.light.hex}}"
secondary_foreground = "{{colors.tertiary.light.hex}}"

[colors.list.item.selection]
background = "{{colors.secondary_container.light.hex}}"
foreground = "{{colors.on_secondary_container.light.hex}}"
secondary_background = "{{colors.tertiary_container.light.hex}}"
secondary_foreground = "{{colors.on_tertiary_container.light.hex}}"

[colors.grid.item]
background = "{{colors.primary_container.light.hex}}"
hover = { outline = "{{colors.source_color.light.hex}}" }
selection = { outline = "{{colors.source_color.light.hex}}" }

[colors.scrollbars]
background = "{{colors.on_primary_fixed_variant.light.hex}}"

[colors.loading]
bar = "{{colors.tertiary.light.hex}}"
spinner = "{{colors.tertiary.light.hex}}"

