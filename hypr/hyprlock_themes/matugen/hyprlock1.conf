###############################################
# USER LABEL
###############################################
label {
    monitor =
    text =    $USER
    color = $entry_color
    font_size = 35
    font_family = $font_family
    position = 0, 25
    halign = center
    valign = bottom
}

###############################################
# INPUT FIELD
###############################################
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1

    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $text_color
    check_color = $entry_color
    fail_color = rgba(ff5555ff)

    fade_on_empty = true
    placeholder_text = <i>Password...</i>

    position = 0, 85
    halign = center
    valign = bottom
    shadow_passes = 2
}

