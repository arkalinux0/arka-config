# Importa i colori generati da matugen
source = /home/arka/.config/matugen/generated/hyprlock-colors.conf

background {
    monitor =
    path = $background_image
    blur_size = 0
    blur_passes = 1
    brightness = 0.4
    color = $background
}

###############################################
# 10 OROLOGI SPARSI PER LO SCHERMO
###############################################

$clock_font = $font
$clock_color = $text_color

# CLOCK 1 — Alto Destra (grande)
label {
    text = cmd[update:1000] echo "$(date +'%H')"
    color = $clock_color
    font_size = 130
    font_family = $clock_font
    halign = right
    valign = top
    position = -80, 40
}
label {
    text = cmd[update:1000] echo "$(date +'%M')"
    color = $clock_color
    font_size = 130
    font_family = $clock_font
    halign = right
    valign = top
    position = -80, 180
}

