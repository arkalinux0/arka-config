# Importa i colori generati da matugen
source = /home/arka/.config/matugen/generated/hyprlock-colors.conf

background {
    monitor =
    # Utilizza l'immagine impostata da matugen
    path = $background_image
    blur_size = 0
    blur_passes = 0.2
    brightness = 0.4
    color = $background
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1

    # Colori dinamici basati su matugen
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $text_color
    # Colori di stato (puoi anche mapparli a variabili matugen se presenti)
    check_color = $entry_color
    fail_color = rgba(ff5555ff) # Rosso fisso o variabile personalizzata

    fade_on_empty = true
    placeholder_text = <i>Password...</i>

    position = 0, 85
    halign = center
    valign = bottom
    shadow_passes = 2
}

# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = $text_color
    font_size = 180
    font_family = $font
    shadow_passes = 0
    shadow_size = 0

    position = -100, -70
    halign = right
    valign = top
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = $text_color
    font_size = 200
    font_family = $font
    shadow_passes = 0
    shadow_size = 0

    position = -100, -270
    halign = right
    valign = top
}


label {
    monitor =
    text =    $USER
    color = $entry_color
    font_size = 35
    font_family = $font_family

    position = 0, 25
    halign = center
    valign = bottom
}
